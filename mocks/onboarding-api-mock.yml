          {
            "preferences": {
              "locale": "en-GB",
              "timezone": "Europe/London",
              "notifications": {
                "email": true,
                "productUpdates": false
              }
            },
            "onboarding": {
              "completed": [
                "signup",
                "verify-email",
                "login",
                "accept-terms",
                "update-profile",
                "set-preferences"
              ],
              "pending": [
                "enable-2fa",
                "create-workspace",
                "invite-teammates",
                "select-plan",
                "complete-onboarding"
              ],
              "progress": "6/11"
            }
          }
  - name: "set-preferences: Failure (mock)"
    description: "Returned when the request sends x-simulate-outcome: failure"
    request:
      method: PUT
      url: "{{baseUrl}}/users/me/preferences"
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "UNSUPPORTED_LOCALE",
            "message": "The requested locale is not supported",

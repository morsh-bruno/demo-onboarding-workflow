        data: |-
          {
            "enabled": true,
            "method": "totp",
            "secret": "MOCKSECRET2FA0001",
            "backupCodes": [
              "a1b2c3d4",
              "e5f6a7b8",
              "c9d0e1f2",
              "a3b4c5d6",
              "e7f8a9b0"
            ],
            "onboarding": {
              "completed": [
                "signup",
                "verify-email",
                "login",
                "accept-terms",

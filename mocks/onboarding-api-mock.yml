        data: |-
          {
            "profile": {
              "displayName": "Ada",
              "jobTitle": "QA Engineer",
              "company": "Analytical Engines Ltd",
              "bio": "Testing workflows with Bruno"
            },
            "onboarding": {
              "completed": [
                "signup",
                "verify-email",
                "login",
                "accept-terms",
                "update-profile"
              ],
              "pending": [
                "set-preferences",
                "enable-2fa",
                "create-workspace",
                "invite-teammates",
                "select-plan",
                "complete-onboarding"
              ],
              "progress": "5/11"
            }
          }
  - name: "update-profile: Failure (mock)"
    description: "Returned when the request sends x-simulate-outcome: failure"
    request:
      method: PATCH
      url: "{{baseUrl}}/users/me/profile"
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "VALIDATION_ERROR",

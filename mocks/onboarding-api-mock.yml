info:
  name: Onboarding API Mock
  type: mock
mock:
  port: 4000
  delay: 150
routes:
  - name: health (mock)
    description: Lets npm test scripts check that the mock server is running
    request:
      method: GET
      url: "{{baseUrl}}/health"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": "ok",
            "mock": true
          }
  - name: "signup: Success (mock)"
    description: Default response for POST /auth/signup
    request:
      method: POST
      url: "{{baseUrl}}/auth/signup"
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "userId": "usr_mock00000001",
            "email": "ada@example.com",
            "message": "Account created. A verification code was sent to your email.",
            "debugOtp": "123456",
            "onboarding": {
              "completed": [
                "signup"
              ],
              "pending": [
                "verify-email",
                "login",
                "accept-terms",
                "update-profile",
                "set-preferences",
                "enable-2fa",
                "create-workspace",
                "invite-teammates",
                "select-plan",
                "complete-onboarding"
              ],
              "progress": "1/11"
            }
          }
  - name: "signup: Failure (mock)"
    description: "Returned when the request sends x-simulate-outcome: failure"
    request:
      method: POST
      url: "{{baseUrl}}/auth/signup"
    response:
      status: 409
      statusText: Conflict
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "EMAIL_ALREADY_EXISTS",
            "message": "An account with this email already exists",
            "step": "signup",
            "simulated": true
          }
    rules:
      operator: AND
      conditions:
        - target: header
          key: x-simulate-outcome
          operator: equals
          value: failure
  - name: "verify-email: Success (mock)"
    description: Default response for POST /auth/verify-email
    request:
      method: POST
      url: "{{baseUrl}}/auth/verify-email"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "userId": "usr_mock00000001",
            "emailVerified": true,
            "onboarding": {
              "completed": [
                "signup",
                "verify-email"
              ],
              "pending": [
                "login",
                "accept-terms",
                "update-profile",
                "set-preferences",
                "enable-2fa",
                "create-workspace",
                "invite-teammates",
                "select-plan",
                "complete-onboarding"
              ],
              "progress": "2/11"
            }
          }
  - name: "verify-email: Failure (mock)"
    description: "Returned when the request sends x-simulate-outcome: failure"
    request:
      method: POST
      url: "{{baseUrl}}/auth/verify-email"
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "INVALID_OTP",
            "message": "The verification code is invalid or has expired",
            "step": "verify-email",
            "simulated": true
          }
    rules:
      operator: AND
      conditions:
        - target: header
          key: x-simulate-outcome
          operator: equals
          value: failure
  - name: "login: Success (mock)"
    description: Default response for POST /auth/login
    request:
      method: POST
      url: "{{baseUrl}}/auth/login"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "accessToken": "mock-access-token-0001",
            "tokenType": "Bearer",
            "expiresIn": 3600,
            "onboarding": {
              "completed": [
                "signup",
                "verify-email",
                "login"
              ],
              "pending": [
                "accept-terms",
                "update-profile",
                "set-preferences",
                "enable-2fa",
                "create-workspace",
                "invite-teammates",
                "select-plan",
                "complete-onboarding"
              ],
              "progress": "3/11"
            }
          }
  - name: "login: Failure (mock)"
    description: "Returned when the request sends x-simulate-outcome: failure"
    request:
      method: POST
      url: "{{baseUrl}}/auth/login"
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "INVALID_CREDENTIALS",
            "message": "Email or password is incorrect",
            "step": "login",
            "simulated": true
          }
    rules:
      operator: AND
      conditions:
        - target: header
          key: x-simulate-outcome
          operator: equals
          value: failure
  - name: "accept-terms: Success (mock)"
    description: Default response for POST /users/me/terms
    request:
      method: POST

      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "workspaceId": "ws_mock00000001",
            "name": "Analytical Engines",
            "slug": "analytical-engines",
            "onboarding": {
              "completed": [
                "signup",

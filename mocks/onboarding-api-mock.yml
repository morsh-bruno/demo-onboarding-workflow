        data: |-
          {
            "version": "2026-01",
            "acceptedAt": "2026-09-27T10:00:00.000Z",
            "onboarding": {
              "completed": [
                "signup",
                "verify-email",
                "login",
                "accept-terms"
              ],
              "pending": [
                "update-profile",
                "set-preferences",
                "enable-2fa",
                "create-workspace",
                "invite-teammates",
                "select-plan",
                "complete-onboarding"
              ],
              "progress": "4/11"
            }
          }
  - name: "accept-terms: Failure (mock)"
    description: "Returned when the request sends x-simulate-outcome: failure"
    request:
      method: POST
      url: "{{baseUrl}}/users/me/terms"
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "TERMS_VERSION_OUTDATED",
            "message": "Terms version must be 2026-01",
            "step": "accept-terms",
            "simulated": true
          }
    rules:
      operator: AND

                "update-profile",
                "set-preferences",
                "enable-2fa",
                "create-workspace"
              ],
              "pending": [
                "invite-teammates",
                "select-plan",
                "complete-onboarding"
              ],
              "progress": "8/11"
            }
          }
  - name: "create-workspace: Failure (mock)"
    description: "Returned when the request sends x-simulate-outcome: failure"
    request:
      method: POST
      url: "{{baseUrl}}/workspaces"
    response:
      status: 409
      statusText: Conflict
      headers:

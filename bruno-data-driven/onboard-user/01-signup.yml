info:
  name: 01 Signup
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/auth/signup"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "{{name}}",
        "email": "{{email}}",
        "password": "{{password}}"
      }

runtime:
  variables:
    - name: step
      value: signup
  scripts:
    - type: before-request
      code: |-
        // Unique email per user and run so the workflow can be re-run without resetting the server.
        bru.setVar("email", `${bru.runner.iterationData.get("emailPrefix") || "ada"}+${Date.now()}@example.com`);
    - type: after-response
      code: |-
        if (res.getStatus() === 201) {
          bru.setVar("userId", res.getBody().userId);
          bru.setVar("otp", res.getBody().debugOtp);
        }
    - type: tests
      code: |-
        test("account is created", function () {
          expect(res.getStatus()).to.equal(201);
        });

        test("returns userId and a verification code", function () {
          const body = res.getBody();
          expect(body.userId).to.match(/^usr_/);
          expect(body.debugOtp).to.match(/^\d{6}$/);
        });

        test("signup step is marked complete", function () {
          expect(res.getBody().onboarding.completed).to.include("signup");
        });

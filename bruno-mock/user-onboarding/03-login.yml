info:
  name: 03 Login
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{email}}",
        "password": "{{password}}"
      }

runtime:
  variables:
    - name: step
      value: login
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
          bru.setVar("accessToken", res.getBody().accessToken);
        }
    - type: tests
      code: |-
        test("login succeeds", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("returns a bearer access token", function () {
          expect(res.getBody().tokenType).to.equal("Bearer");
          expect(res.getBody().accessToken).to.be.a("string").and.not.be.empty;
        });

examples:
  - name: Success
    description: login succeeds
    request:
      url: "{{baseUrl}}/auth/login"
      method: POST
      headers:
        - name: x-simulate-outcome
          value: success
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "accessToken": "mock-access-token-0001",
            "tokenType": "Bearer",
            "expiresIn": 3600,
            "onboarding": {
              "completed": [
                "signup",
                "verify-email",
                "login"
              ],
              "pending": [
                "accept-terms",
                "update-profile",
                "set-preferences",
                "enable-2fa",
                "create-workspace",
                "invite-teammates",
                "select-plan",
                "complete-onboarding"
              ],
              "progress": "3/11"
            }
          }
  - name: Failure
    description: "login fails (x-simulate-outcome: failure)"
    request:
      url: "{{baseUrl}}/auth/login"
      method: POST
      headers:
        - name: x-simulate-outcome
          value: failure
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "INVALID_CREDENTIALS",
            "message": "Email or password is incorrect",
            "step": "login",
            "simulated": true
          }

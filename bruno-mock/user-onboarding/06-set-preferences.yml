info:
  name: 06 Set Preferences
  type: http
  seq: 6

http:
  method: PUT
  url: "{{baseUrl}}/users/me/preferences"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "locale": "en-GB",
        "timezone": "Europe/London",
        "notifications": {
          "email": true,
          "productUpdates": false
        }
      }

runtime:
  variables:
    - name: step
      value: set-preferences
  scripts:
    - type: tests
      code: |-
        test("preferences are saved", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("preferences reflect submitted values", function () {
          expect(res.getBody().preferences.locale).to.equal("en-GB");
          expect(res.getBody().preferences.timezone).to.equal("Europe/London");
        });

examples:
  - name: Success
    description: set-preferences succeeds
    request:
      url: "{{baseUrl}}/users/me/preferences"
      method: PUT
      headers:
        - name: x-simulate-outcome
          value: success
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "preferences": {
              "locale": "en-GB",
              "timezone": "Europe/London",
              "notifications": {
                "email": true,
                "productUpdates": false
              }
            },
            "onboarding": {
              "completed": [
                "signup",
                "verify-email",
                "login",
                "accept-terms",
                "update-profile",
                "set-preferences"
              ],
              "pending": [
                "enable-2fa",
                "create-workspace",
                "invite-teammates",
                "select-plan",
                "complete-onboarding"
              ],
              "progress": "6/11"
            }
          }
  - name: Failure
    description: "set-preferences fails (x-simulate-outcome: failure)"
    request:
      url: "{{baseUrl}}/users/me/preferences"
      method: PUT
      headers:
        - name: x-simulate-outcome
          value: failure
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "UNSUPPORTED_LOCALE",
            "message": "The requested locale is not supported",
            "step": "set-preferences",
            "simulated": true
          }
